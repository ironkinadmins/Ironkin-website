<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grand Heist · Team Workspace</title><style>

}@media(max-width:640px){main{padding:8px}.panel{padding:14px}.taskhead{display:block}.status{display:inline-block;margin-top:8px}}.risk-intro{color:#bfc0c5;margin:0 0 14px}.risk-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0}.risk-card{display:flex;flex-direction:column;text-align:left;gap:12px;min-height:205px;margin:0;padding:17px;background:#17171b;border:1px solid #404048;border-radius:12px;color:#f1f1f3;font-weight:400;transition:border-color .15s,background .15s,transform .15s}.risk-card:hover:not(:disabled){background:#222128;border-color:#b77c46;transform:translateY(-1px)}.risk-card.is-selected{background:#292117;border:2px solid #f39a43;padding:16px}.risk-card:focus-visible{outline:3px solid #f5ae67;outline-offset:3px}.risk-card:disabled{opacity:.42;cursor:not-allowed}.risk-card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.risk-card-name{font-size:16px;font-weight:800}.risk-card-indicator{width:22px;height:22px;flex-shrink:0;border:2px solid #777783;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900}.is-selected .risk-card-indicator{background:#f39a43;color:#1b120a;border-color:#f39a43}.risk-card-description{display:block;line-height:1.5;color:#c8c8ce;font-size:13px;flex:1}.risk-card-stats{display:flex;flex-wrap:wrap;gap:6px}.risk-chip{display:inline-block;background:#303036;color:#e7e7ec;padding:5px 8px;border-radius:6px;font-size:11px;font-weight:750}.risk-chip.cool{background:#173b32;color:#8ae3b5}.risk-unavailable{font-size:12px;color:#ffb3b3;font-weight:700}.risk-footer{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.risk-footer p{flex:1 1 380px}.risk-confirm{margin:0;padding:12px 22px}.risk-confirm:disabled{opacity:.45;cursor:not-allowed}.risk-confirm:disabled:hover{background:#ef852a}@media(max-width:850px){.risk-cards{grid-template-columns:1fr}.risk-card{min-height:0}}
/* Grand Heist onboarding FAQ */
.heist-faq-open{overflow:hidden}.heist-faq-overlay{position:fixed;inset:0;z-index:9999;background:rgba(2,3,7,.91);display:flex;align-items:center;justify-content:center;padding:16px}.heist-faq-panel{width:min(760px,100%);max-height:min(92dvh,950px);overflow:auto;background:#141417;border:1px solid #55412d;border-radius:18px;box-shadow:0 24px 90px #000a;padding:24px}.heist-faq-eyebrow{color:#f5a458;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.heist-faq-panel h2{font-size:27px;margin:5px 0 9px;color:#fff}.heist-faq-panel .heist-faq-intro{color:#bcbcc3;margin-bottom:18px}.heist-faq-list{display:grid;gap:8px}.heist-faq-list details{margin:0;padding:0;border:1px solid #35353c;border-radius:10px;background:#1c1c21}.heist-faq-list summary{padding:13px 15px;color:#f4f4f5;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px}.heist-faq-list summary::-webkit-details-marker{display:none}.heist-faq-list summary::after{content:'+';color:#f5a458;font-size:20px}.heist-faq-list details[open] summary::after{content:'−'}.heist-faq-list details p{padding:0 15px 14px;margin:0;color:#c4c4ca}.heist-faq-actions{position:sticky;bottom:-24px;padding:16px 0 0;background:linear-gradient(transparent,#141417 12px);display:flex;gap:12px;justify-content:flex-end}.heist-faq-enter{padding:13px 22px;margin:0}.heist-faq-reopen{background:#272329;color:#f5ac69;border:1px solid #63472f;padding:9px 13px;font-size:13px}.heist-faq-reopen:hover{background:#3a302c}.heist-faq-panel button:focus-visible,.heist-faq-list summary:focus-visible{outline:2px solid #ffb266;outline-offset:3px}@media(max-width:600px){.heist-faq-panel{padding:16px;max-height:94dvh}.heist-faq-panel h2{font-size:23px}.heist-faq-actions{bottom:-16px}}
</style></head><body><main><div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button type="button" id="heist-faq-reopen" class="heist-faq-reopen">How to Play / FAQ</button></div><div id="heist-notice" role="status" aria-live="polite"></div><div id="heist-root"><p>Loading your Grand Heist workspace…</p></div></main><script>
(()=>{
  'use strict';
  const params=new URLSearchParams(location.search);
  const key='ironkin-heist-faq-seen-v1-'+(params.get('mode')==='test'?'test':'live');
  const questions=[
    ['How does Grand Heist work?','Complete five phases in order. Your team must finish the core objectives and its selected risk challenge before unlocking the next phase. Later-phase progress does not count early.'],
    ['How do we choose a risk?','Each phase offers Stealth, Calculated Risk, or All-In. Select a card and confirm. The decision is permanent for that phase.'],
    ['What is Heat?','Heat starts at 0 and cannot exceed 75. Stealth removes up to 15 Heat (minimum 0). Calculated Risk adds 10 Heat for a possible 10 bonus points. All-In adds 25 Heat for a possible 20 bonus points. No direct point deductions apply.'],
    ['When are risk points awarded?','Heat changes as soon as the choice is locked, even if you do not finish the challenge. Risk bonus points count only after the extra challenge is completed and approved. Core and risk progress must be separate.'],
    ['Can we change a risk choice or exceed 75 Heat?','No. Confirmed choices cannot be changed. A choice that would push your Heat above 75 is unavailable. Stealth can lower Heat to preserve options in later phases.'],
    ['When does WOM tracking begin?','Only progress earned after your team unlocks the relevant phase is eligible. Refresh WOM when the phase opens to establish or update the relevant baseline. Earlier-phase gains do not count.'],
    ['How do we refresh WOM?','Use the Refresh WOM progress button in Your Team. WOM updates may be delayed or cached. If automatic verification is unavailable, keep screenshots and other proof for organizer review.'],
    ['Which tasks need screenshots or other proof?','Use the Submit proof control on each task. Item production, drops, Wilderness challenges, riddles, and other tasks WOM cannot verify require suitable evidence. Do not reuse progress already counted for a different task.'],
    ['How do the bank riddles work?','Solve the three bank riddles in Phase 1. Your crew receives a persistent, randomly assigned extraction bank from Falador East Bank, Al Kharid Bank, and Varrock West Bank. Different teams may receive the same bank.'],
    ['What is Final Extraction?','In Phase 5, gather at your team’s assigned bank in Fashionscape. Submit one screenshot showing at least three teammates with visible RSNs. Judges award 50 / 35 / 20 / 10 points by placement.'],
    ['How is the final result decided?','Approved core tasks, risk bonuses, participation, and Fashionscape determine your Grand Heist score. Ties use Fashionscape rank, then lower final Heat, then completed core tasks and verified participation. Week 5 season placement awards 150 / 105 / 75 / 45 points.']
  ];
  const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function show(){
    if(document.getElementById('heist-faq-overlay'))return;
    const overlay=document.createElement('div');overlay.id='heist-faq-overlay';overlay.className='heist-faq-overlay';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-labelledby','heist-faq-heading');
    overlay.innerHTML='<div class="heist-faq-panel"><span class="heist-faq-eyebrow">Before you begin</span><h2 id="heist-faq-heading">The Grand Heist - How to Play</h2><p class="heist-faq-intro">Review the rules before entering your team workspace. You can reopen this guide at any time.</p><div class="heist-faq-list">'+questions.map(([q,a])=>'<details><summary>'+escapeHTML(q)+'</summary><p>'+escapeHTML(a)+'</p></details>').join('')+'</div><div class="heist-faq-actions"><button type="button" class="heist-faq-enter" id="heist-faq-enter">Enter The Grand Heist</button></div></div>';
    document.body.appendChild(overlay);document.body.classList.add('heist-faq-open');
    const dismiss=()=>{try{localStorage.setItem(key,'1')}catch(_){}overlay.remove();document.body.classList.remove('heist-faq-open');document.getElementById('heist-faq-reopen')?.focus()};
    overlay.querySelector('#heist-faq-enter').addEventListener('click',dismiss);
    overlay.querySelector('#heist-faq-enter').focus();
    overlay.addEventListener('keydown',e=>{if(e.key==='Tab'){const focusables=[...overlay.querySelectorAll('summary,button')];const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
  }
  document.getElementById('heist-faq-reopen').addEventListener('click',show);
  let seen=false;try{seen=localStorage.getItem(key)==='1'}catch(_){}
  if(!seen)show();
})();
</script><script src="/assets/js/ironkin-games-heist.js?v=20261103-riskcards-extraction" defer></script><script>if(new URLSearchParams(location.search).has("embedded")){document.body.classList.add("embedded");const send=()=>parent.postMessage({type:"ironkin-heist-height",height:document.documentElement.scrollHeight},location.origin);new ResizeObserver(send).observe(document.body);window.addEventListener("load",send);send();}</script></body></html>
