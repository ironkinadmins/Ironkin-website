<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hall of Flame | Ironkin Clan</title>
  <link rel="icon" type="image/png" href="/assets/ironkin-emblem-favicon.png">
  <link rel="apple-touch-icon" href="/assets/ironkin-emblem.png">
  <link rel="stylesheet" href="/assets/css/styles.css?v=20261017-i1" />
  <link rel="stylesheet" href="/assets/css/premium-v5.css?v=20261017-d1">
  <link rel="stylesheet" href="/assets/css/hof-refined.css?v=20261017-d1">
  <link rel="stylesheet" href="/assets/css/ironkin-sitewide-layout.css?v=20261016-wide-v1">
  <link rel="stylesheet" href="/assets/css/ironkin-d.css?v=20261017-s4" />
</head>
<body>
  <div id="siteNav"></div>

<main class="page">
    <section class="page-title hof-hero" aria-labelledby="hofPageTitle">
      <div class="hof-hero-main">
        <div class="hof-hero-copy">
          <p class="eyebrow">Ironkin Records</p>
          <h1 id="hofPageTitle">Hall of Flame</h1>
          <p>Clan personal bests, verified proof, and the records worth chasing.</p>
        </div>
        <button id="hofSubmitOpen" class="btn primary hof-hero-submit" type="button">Submit a PB →</button>
      </div>
      <nav id="hofUtilityBar" class="hof-utility-bar" aria-label="Hall of Flame tools">
        <a class="hof-utility-link is-active" href="#hallOfFlameGrid">Record Boards</a>
        <button id="hofMySubmissionsOpen" class="hof-utility-link" type="button" hidden>My Submissions</button>
        <button id="hofReviewOpen" class="hof-utility-link" type="button" hidden>Review Queue <span id="hofPendingCount"></span></button>
        <button id="hofManageOpen" class="hof-utility-link" type="button" hidden>Manage Records</button>
      </nav>
    </section>

    <section id="hofRecentRecords" class="hof-recent-records" hidden></section>

    <section class="hof-explore" aria-label="Explore record boards">
      <div class="hof-explore-heading"><div><p class="eyebrow">The record vault</p><h2>Boss record boards</h2></div><span id="hofBoardCount" class="hof-board-count" aria-live="polite"></span></div>
      <div class="hof-explore-controls"><label class="hof-search-label" for="hofBoardSearch"><span>Search bosses or record holders</span><input id="hofBoardSearch" type="search" placeholder="Search the Hall of Flame…" autocomplete="off"></label><label class="hof-sort-label" for="hofBoardSort"><span>Sort boards</span><select id="hofBoardSort"><option value="name">Boss name A–Z</option><option value="leaders">Most record holders</option><option value="name-desc">Boss name Z–A</option></select></label><button id="hofClearSearch" class="hof-clear" type="button" hidden>Clear search</button></div>
    </section>
    <section id="hallOfFlameGrid" class="hall-grid" aria-live="polite">
      <article class="card">
        <p>Loading Hall of Flame...</p>
      </article>
    </section>
    <dialog id="hofDialog" class="hof-dialog">
      <div class="hof-dialog-shell">
        <button class="hof-dialog-close" type="button" data-hof-close aria-label="Close">×</button>
        <div id="hofDialogBody"></div>
      </div>
    </dialog>
  </main>

  <footer><p>© Ironkin Clan. Not affiliated with Jagex.</p></footer>
  <script src="/assets/js/script.js?v=20261017-p2"></script>
  <script src="/assets/js/premium-v5.js?v=20260825-v5-fix1" defer></script>
<script src="/assets/js/ironkin-motion.js?v=20261017-d1" defer></script>
<script src="/assets/js/ironkin-icons.js?v=20261017-i1" defer></script>
</body>
</html>
