<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Archive | Ironkin Clan</title>
  <link rel="icon" type="image/png" href="/assets/ironkin-emblem-favicon.png">
  <link rel="apple-touch-icon" href="/assets/ironkin-emblem.png">
  <link rel="stylesheet" href="/assets/css/styles.css?v=20261001-archive-fix1" />
  <link rel="stylesheet" href="/assets/css/premium-v5.css?v=20260913-modern-nav-headings">
</head>
<body class="archive-page">
  <div id="siteNav"></div>

<main class="page">
    <section class="page-title archive-page-title">
      <div>
        <p class="eyebrow">Ironkin History</p>
        <h1>Event Archive</h1>
        <p>Past competitions, clan goals, and community events — with final standings preserved.</p>
      </div>
      <a class="btn secondary archive-events-link" href="/events.html">Current Events <span aria-hidden="true">→</span></a>
    </section>

    <section class="archive-toolbar" aria-label="Archive controls">
      <div class="archive-filter-group" role="group" aria-label="Filter archived events">
        <button class="archive-filter active" type="button" data-archive-filter="all">All</button>
        <button class="archive-filter" type="button" data-archive-filter="sotw">SOTW</button>
        <button class="archive-filter" type="button" data-archive-filter="botw">BOTW</button>
        <button class="archive-filter" type="button" data-archive-filter="clan-goal">Clan Goals</button>
        <button class="archive-filter" type="button" data-archive-filter="bingo">Bingo</button>
      </div>
      <label class="archive-search">
        <span class="sr-only">Search archived events</span>
        <input id="archiveSearch" type="search" placeholder="Search archive…" autocomplete="off" />
      </label>
      <span id="archiveResultCount" class="archive-result-count" aria-live="polite"></span>
    </section>

    <section id="archiveGrid" class="archive-grid">
      <article class="card">
        <p>Loading archived events...</p>
      </article>
    </section>
  </main>

  <footer><p>© Ironkin Clan. Not affiliated with Jagex.</p></footer>
  <script src="/assets/js/script.js?v=20261001-archive-fix1"></script>
  <script src="/assets/js/premium-v5.js?v=20260825-v5-fix1" defer></script>
</body>
</html>
