/* Community Goals readability and density improvements */
main.goals-page{max-width:1200px;width:calc(100% - 48px);box-sizing:border-box;margin:38px auto;padding:24px 0 64px}
.goals-page h1{font-size:clamp(2.6rem,4vw,4rem);line-height:1.12;margin-bottom:16px}
.goals-page>p{font-size:1rem;line-height:1.6}

</style></head><body class="premium-ui goals-premium-page"><div id="siteNav"></div><main class="page goals-page"><h1>Ironkin Goals</h1><p>Every legend is forged one milestone at a time. Follow the clan's journeys and manage your own.</p><div class="tabs"><button id="communityTab" aria-selected="true">Community Goals</button><button id="mineTab" aria-selected="false">My Goals</button></div><p id="notice" role="status"></p><section id="community"><div class="goal-filters"><label>Search goals or members<input id="goalSearch" type="search" placeholder="Search goals or members"></label><label>Member<select id="memberFilter"><option value="">All members</option></select></label><label>Category<select id="categoryFilter"><option value="">All categories</option></select></label><label>Status<select id="statusFilter"><option value="">All statuses</option><option value="in_progress">In progress</option><option value="completed">Completed</option></select></label></div><p class="goal-count" id="goalCount" role="status"></p><div class="cards goal-cards" id="publicList"></div><nav class="goal-pager" aria-label="Goals pages"><button class="action" id="prevGoals" type="button">Previous</button><span id="goalPageInfo" class="muted"></span><button class="action" id="nextGoals" type="button">Next</button></nav></section><section id="mine" hidden><p id="loginPrompt" hidden>Sign in with Discord to manage your goals. <a href="/api/auth/login?returnTo=%2Fgoals.html">Sign in</a></p><div id="editor" hidden><button class="action" type="button" id="addGoal">+ Add a Goal</button><dialog id="goalDialog" class="goal-dialog" aria-labelledby="formHeading"><h2 id="formHeading">Add a Goal</h2><p id="formNotice" class="goal-notice" role="status"></p><form id="goalForm"><label>Goal title<input name="title" maxlength="120" required placeholder="e.g. Infernal Cape"></label><label>Category<select name="category"><option>PvM</option><option>Skilling</option><option>Quests</option><option>Collection Log</
