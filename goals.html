<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community Goals | Ironkin</title><link rel="icon" href="/assets/ironkin-emblem-favicon.png"><link rel="stylesheet" href="/assets/css/styles.css"><link rel="stylesheet" href="/assets/css/premium-v5.css"><style>main{max-width:1100px;margin:35px auto;padding:20px;color:#eee}h1{color:#f4b66d}.tabs{display:flex;gap:12px;margin:24px 0}.tabs button,.action{background:#33281f;border:1px solid #88633f;color:#ffdaa8;border-radius:8px;padding:10px 16px;cursor:pointer}.tabs button[aria-selected=true]{background:#76502b}section[hidden]{display:none}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:15px}.goal{background:#1c1a19;border:1px solid #574432;border-radius:12px;padding:18px}.goal h3{margin:0 0 9px;color:#ffcf91}.muted{color:#b6a899;font-size:13px}.bar{height:8px;background:#40362d;border-radius:10px;overflow:hidden;margin:12px 0}.bar>div{height:100%;background:#d79a55}form{background:#1c1a19;padding:18px;border:1px solid #574432;border-radius:12px;display:grid;gap:10px;max-width:550px;margin-bottom:20px}label{display:grid;gap:4px}input,select{background:#292522;border:1px solid #725c46;border-radius:6px;color:#fff;padding:10px;width:100%;box-sizing:border-box}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.error{color:#ff9c91}button:focus-visible,input:focus-visible{outline:2px solid #ffcf91}</style></head><body><div id="nav-placeholder"></div><main><h1>⚒️ Ironkin Goals</h1><p>Every legend is forged one milestone at a time. Follow the clan's journeys and manage your own.</p><div class="tabs"><button id="communityTab" aria-selected="true">Community Goals</button><button id="mineTab" aria-selected="false">My Goals</button></div><p id="notice" role="status"></p><section id="community"><div class="cards" id="publicList"></div></section><section id="mine" hidden><p id="loginPrompt" hidden>Sign in with Discord to manage your goals. <a href="/api/auth/login?returnTo=%2Fgoals.html">Sign in</a></p><div id="editor" hidden><h2 id="formHeading">Add a Goal</h2><form id="goalForm"><label>Goal title<input name="title" maxlength="120" required placeholder="e.g. Infernal Cape"></label><label>Category<select name="category"><option>PvM</option><option>Skilling</option><option>Quests</option><option>Collection Log</option><option>Other</option></select></label><label>Current progress<input name="progress" type="number" min="0" step="any" value="0" required></label><label>Target (optional)<input name="target" type="number" min="0.01" step="any"></label><label>Unit (optional)<input name="unit" maxlength="24" placeholder="KC, XP, levels..."></label><label>Status<select name="status"><option value="in_progress">In progress</option><option value="completed">Completed</option></select></label><label><span><input name="is_public" type="checkbox" style="width:auto"> Show publicly on Community Goals</span></label><div class="actions"><button class="action" type="submit">Save Goal</button><button class="action" type="button" id="cancel" hidden>Cancel Edit</button></div></form><h2>Your Goals</h2><div class="cards" id="myList"></div></div></section></main><script src="/assets/js/goals.js" defer></script><script src="/assets/js/script.js?v=20261017-p2"></script></body></html>
