<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ironkin • Discord Information Editor</title><link rel="stylesheet" href="/assets/css/styles.css"><style>
body{background:#101010;color:#eee;font:15px system-ui,sans-serif;margin:0}.wrap{max-width:1200px;margin:36px auto;padding:0 18px}h1{color:#e6b46f}a{color:#e6b46f}.layout{display:grid;grid-template-columns:290px 1fr;gap:18px}.panel{background:#1b1a19;border:1px solid #514238;border-radius:14px;padding:18px}.entry{display:block;width:100%;text-align:left;background:#282522;color:#eee;border:1px solid #40382e;border-radius:9px;padding:12px;margin:8px 0;cursor:pointer}.entry.active{border-color:#e6b46f}label{display:block;font-weight:650;margin:14px 0 5px}input,textarea,select{box-sizing:border-box;width:100%;background:#101010;color:#fff;border:1px solid #66513d;border-radius:8px;padding:11px;font:inherit}textarea{min-height:190px;resize:vertical}button{border:1px solid #a57942;border-radius:8px;background:#d5a35f;color:#17110c;padding:10px 15px;font-weight:700;cursor:pointer}button.secondary{background:#282522;color:#f4d5ab}button:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.preview{border-left:4px solid #d4a44e;background:#222;padding:16px;margin-top:20px;border-radius:4px;overflow-wrap:anywhere}.preview h3{margin:0 0 12px}.preview p{white-space:pre-wrap}.preview img{max-width:100%;max-height:400px}.muted{color:#b9aa98}.status{margin:15px 0;min-height:24px}.danger{color:#ffaaaa}@media(max-width:760px){.layout{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="/admin.html">← Admin Dashboard</a><h1>Discord Information Editor</h1><p class="muted">Edit individual clan-info and rank-info sections. Saving stores a draft in Supabase; publishing updates or creates a Discord webhook message. Existing manually posted messages are never deleted.</p><div class="status" id="status" role="status">Loading…</div><div class="layout"><aside class="panel"><label for="channelFilter">Channel</label><select id="channelFilter"><option value="clan-info">#clan-info</option><option value="rank-info">#rank-info</option></select><div id="sections"></div><button id="new" class="secondary">+ New section</button></aside><section class="panel"><label for="id">Section ID (permanent)</label><input id="id" placeholder="e.g. clan-rules"><label for="channel">Channel</label><select id="channel"><option value="clan-info">#clan-info</option><option value="rank-info">#rank-info</option></select><label for="title">Embed title</label><input id="title" maxlength="256"><label for="description">Embed description (Discord Markdown)</label><textarea id="description" maxlength="4000"></textarea><label for="image">Screenshot/image HTTPS URL (optional)</label><input id="image" placeholder="https://..."><label for="order">Display order in editor</label><input id="order" type="number" min="0" max="9999" value="0"><label><input type="checkbox" id="enabled" style="width:auto" checked> Enabled</label><div class="actions"><button id="save">Save draft</button><button id="publish" class="secondary">Publish to Discord</button><button id="reload" class="secondary">Reload</button></div><p class="muted" id="metadata"></p><div class="preview"><h3 id="previewTitle">Embed preview</h3><p id="previewBody"></p><img id="previewImage" hidden alt="Embed attachment preview"></div></section></div></main><script src="/assets/js/admin-discord-info.js"></script></body></html>
