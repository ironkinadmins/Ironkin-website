<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ironkin — Homepage Images</title><link rel="stylesheet" href="/assets/css/styles.css?v=20261017-i1"><style>body{background:#10151a;color:#eee;font-family:system-ui,sans-serif}.editor{max-width:940px;margin:45px auto;padding:24px}h1{color:#f6b16a}.item{background:#1b2329;border:1px solid #4b4743;padding:18px;border-radius:12px;margin:14px 0}label{font-weight:700;display:block;margin-bottom:8px}input{box-sizing:border-box;width:100%;padding:12px;background:#0c1115;color:#fff;border:1px solid #54504c;border-radius:8px}.upload-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}.upload-row input{width:auto;max-width:100%}.upload-row button{padding:9px 14px}.preview{margin-top:10px;width:100%;max-height:240px;object-fit:cover;border-radius:8px;display:none}button,.back{background:#e99347;color:#111;padding:12px 20px;border:0;border-radius:8px;font-weight:800;cursor:pointer}.back{display:inline-block;text-decoration:none;background:#323a40;color:white}#status{margin:15px 0;color:#eac49e}</style>  <link rel="stylesheet" href="/assets/css/ironkin-sitewide-layout.css?v=20261016-wide-v1">
  <link rel="stylesheet" href="/assets/css/ironkin-d.css?v=20261017-fx1" />
</head><body><main class="editor"><a class="back" href="/admin.html">← Back to Admin</a><h1>Homepage Images</h1><p>Choose your own artwork for the homepage. Upload PNG, JPG, or WebP artwork directly, or paste a public direct HTTPS image URL. Leave a field blank to use the gradient fallback. Changes appear for all visitors.</p><form id="form"><div id="fields"></div><button id="save" type="submit">Save Homepage Images</button><p id="status" role="status"></p></form></main><script>
const names={hero:'Main cinematic banner',games:'Ironkin Games',flame:'Hall of Flame',events:'Clan Events',profiles:'Member Profiles'};
const fields=document.getElementById('fields');
const status=document.getElementById('status');
const inputs={};
function showPreview(key){
  const url=inputs[key].input.value.trim(),img=inputs[key].img;
  img.style.display='none';img.removeAttribute('src');
  if(url.startsWith('/api/homepage-image-file/')||/^https:\/\//i.test(url)){
    img.onload=()=>img.style.display='block';img.onerror=()=>img.style.display='none';img.src=url;
  }
}
for(const [key,label] of Object.entries(names)){
  const div=document.createElement('div');div.className='item';
  const l=document.createElement('label');l.htmlFor='img-'+key;l.textContent=label;
  const input=document.createElement('input');input.id='img-'+key;input.type='text';input.placeholder='Upload an image or paste a direct HTTPS image URL';input.autocomplete='off';
  const row=document.createElement('div');row.className='upload-row';
  const file=document.createElement('input');file.type='file';file.accept='image/png,image/jpeg,image/webp';file.setAttribute('aria-label','Choose '+label+' image');
  const upload=document.createElement('button');upload.type='button';upload.textContent='Upload image';
  const img=document.createElement('img');img.className='preview';img.alt=label+' preview';
  inputs[key]={input,img,file,upload};
  input.addEventListener('input',()=>showPreview(key));
  upload.addEventListener('click',async()=>{
    if(!file.files?.length){status.textContent='Choose an image first.';return;}
    if(file.files[0].size>8*1024*1024){status.textContent='Image must be 8 MB or smaller.';return;}
    upload.disabled=true;upload.textContent='Uploading…';status.textContent='Uploading '+label+'…';
    try{
      const data=new FormData();data.append('slot',key);data.append('image',file.files[0]);
      const res=await fetch('/api/homepage-image-upload',{method:'POST',body:data});const result=await res.json();
      if(!res.ok)throw Error(result.error||'Upload failed');
      // The upload endpoint saves the image selection for all visitors immediately.
      input.value=result.url;showPreview(key);file.value='';status.textContent=label+' uploaded and saved. Refresh the homepage to see it.';
    }catch(e){status.textContent=e.message;}finally{upload.disabled=false;upload.textContent='Upload image';}
  });
  row.append(file,upload);div.append(l,input,row,img);fields.append(div);
}
async function load(){try{const r=await fetch('/api/homepage-images',{cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.error||'Unable to load');for(const key of Object.keys(names)){inputs[key].input.value=data.images?.[key]||'';showPreview(key);}}catch(e){status.textContent=e.message;}}load();
document.getElementById('form').addEventListener('submit',async e=>{
  e.preventDefault();const images={};for(const key of Object.keys(names))images[key]=inputs[key].input.value.trim();
  const btn=document.getElementById('save');btn.disabled=true;status.textContent='Saving…';
  try{const r=await fetch('/api/homepage-images',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({images})});const data=await r.json();if(!r.ok)throw Error(data.error||'Unable to save');status.textContent='Saved. Refresh the homepage to see your images.';}catch(err){status.textContent=err.message;}finally{btn.disabled=false;}
});
</script><script src="/assets/js/ironkin-motion.js?v=20261017-d1" defer></script>
<script src="/assets/js/ironkin-icons.js?v=20261017-i1" defer></script>
</body></html>
