<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ironkin — Homepage Images</title><link rel="stylesheet" href="/assets/css/styles.css"><style>body{background:#10151a;color:#eee;font-family:system-ui,sans-serif}.editor{max-width:940px;margin:45px auto;padding:24px}h1{color:#f6b16a}.item{background:#1b2329;border:1px solid #60452e;padding:18px;border-radius:12px;margin:14px 0}label{font-weight:700;display:block;margin-bottom:8px}input{box-sizing:border-box;width:100%;padding:12px;background:#0c1115;color:#fff;border:1px solid #78644f;border-radius:8px}.preview{margin-top:10px;width:100%;max-height:240px;object-fit:cover;border-radius:8px;display:none}button,.back{background:#e99347;color:#111;padding:12px 20px;border:0;border-radius:8px;font-weight:800;cursor:pointer}.back{display:inline-block;text-decoration:none;background:#323a40;color:white}#status{margin:15px 0;color:#eac49e}</style></head><body><main class="editor"><a class="back" href="/admin.html">← Back to Admin</a><h1>Homepage Images</h1><p>Choose your own artwork for the homepage. Paste a public HTTPS image URL, preview it, and save. Leave a field blank to use the built-in gradient fallback. Changes appear for all visitors.</p><form id="form"><div id="fields"></div><button id="save" type="submit">Save Homepage Images</button><p id="status" role="status"></p></form></main><script>
const names={hero:'Main cinematic banner',games:'Ironkin Games',flame:'Hall of Flame',events:'Clan Events',profiles:'Member Profiles'};
const fields=document.getElementById('fields');for(const [key,label] of Object.entries(names)){const div=document.createElement('div');div.className='item';const l=document.createElement('label');l.htmlFor='img-'+key;l.textContent=label;const input=document.createElement('input');input.id='img-'+key;input.type='url';input.placeholder='https://example.com/image.webp';input.autocomplete='off';const img=document.createElement('img');img.className='preview';img.alt=label+' preview';input.addEventListener('input',()=>{img.style.display='none';if(/^https:\/\//i.test(input.value)){img.onload=()=>img.style.display='block';img.onerror=()=>img.style.display='none';img.src=input.value;}});div.append(l,input,img);fields.append(div);}
const status=document.getElementById('status');async function load(){try{const r=await fetch('/api/homepage-images',{cache:'no-store'});const data=await r.json();if(!r.ok)throw Error(data.error||'Unable to load');for(const key of Object.keys(names)){const input=document.getElementById('img-'+key);input.value=data.images?.[key]||'';input.dispatchEvent(new Event('input'));}}catch(e){status.textContent=e.message;}}load();document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const images={};for(const key of Object.keys(names))images[key]=document.getElementById('img-'+key).value.trim();const btn=document.getElementById('save');btn.disabled=true;status.textContent='Saving…';try{const r=await fetch('/api/homepage-images',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({images})});const data=await r.json();if(!r.ok)throw Error(data.error||'Unable to save');status.textContent='Saved. Refresh the homepage to see your images.';}catch(err){status.textContent=err.message;}finally{btn.disabled=false;}});
</script></body></html>
