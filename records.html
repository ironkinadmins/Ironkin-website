<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore Ironkin's clan records, event champions and historic achievements." />
  <title>Clan Records | Ironkin Clan</title>
  <link rel="icon" type="image/png" href="/assets/ironkin-emblem-favicon.png">
  <link rel="apple-touch-icon" href="/assets/ironkin-emblem.png">
  <link rel="stylesheet" href="/assets/css/styles.css?v=20261001-hof-pb-v1" />
  <link rel="stylesheet" href="/assets/css/premium-v5.css?v=20260913-modern-nav-headings">
  <link rel="stylesheet" href="/assets/css/records-refined.css?v=20261014-legends" />
</head>
<body>
  <div id="siteNav"></div>
  <main class="page records-page">
    <header class="records-hero">
      <div class="records-hero-copy">
        <p class="eyebrow">FORGED ALONE · BOUND AS KIN</p>
        <h1>The Record Books<span class="records-title-dot">.</span></h1>
        <p>Every victory leaves a mark. Explore the champions, milestones, and achievements that shaped Ironkin.</p>
      </div>
      <div class="records-hero-mark" aria-hidden="true">★</div>
      <div class="records-hero-actions"><a href="/archive" class="records-hero-link">Event Archive <span aria-hidden="true">↗</span></a></div>
    </header>
    <section class="records-content" aria-label="Clan achievements">
      <div class="records-toolbar">
        <div><p class="eyebrow">THE IRONKIN LEGACY</p><h2>Hall of achievements</h2></div>
        <div class="records-tabs" role="group" aria-label="Filter record categories">
          <button type="button" class="records-tab is-active" data-record-filter="all" aria-pressed="true">All records</button>
          <button type="button" class="records-tab" data-record-filter="champions" aria-pressed="false">Champions</button>
          <button type="button" class="records-tab" data-record-filter="milestones" aria-pressed="false">Milestones</button>
        </div>
      </div>
      <div id="recordsLegends" class="records-legends" aria-live="polite"></div>
      <section id="recordsGrid" class="records-grid" aria-live="polite" aria-busy="true">
        <div class="records-loading"><span class="records-loading-icon" aria-hidden="true">✦</span> Retrieving clan records…</div>
      </section>
    </section>
  </main>
  <dialog id="recordsProfileDialog" class="records-profile-dialog" aria-labelledby="recordsProfileTitle"><div id="recordsProfileContent"></div><button type="button" class="records-modal-close" aria-label="Close player achievements">✕</button></dialog>
  <footer><p>© Ironkin Clan. Not affiliated with Jagex.</p></footer>
  <script src="/assets/js/script.js?v=20261001-hof-pb-v1"></script>
  <script src="/assets/js/records-refined.js?v=20261014-legends" defer></script>
  <script src="/assets/js/premium-v5.js?v=20260825-v5-fix1" defer></script>
</body>
</html>
